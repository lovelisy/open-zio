[descriptions.modules]
Ambience=改变多种环境效果
AnchorAura=爆炸重生锚来击杀玩家\n<red>在下界无效
Animations=修改实体的动画
Announcer=向他人广播你正在做的事
AntiAFK=防止因挂机而被踢出
AntiAim=在服务器端设置你的旋转角度
AntiBot=移除部分反作弊生成的机器人
AntiCheat=针对不同反作弊调整客户端行为
AntiCyrillic=把你消息中的西里尔字母替换为拉丁字母
AntiHunger=防止饥饿值降低
AntiLevitation=取消可能导致你悬浮的某些效果
AntiPearl=自动放置黑曜石拦截末影珍珠
AntiPhase=防止敌人利用珍珠穿进最近的方块
AntiQuit=防止你意外退出游戏/服务器
AntiSpam=把相似的聊天消息合并
AntiVanish=让隐身的玩家可见
Arrows=在效果箭之间自动切换
Aura=攻击附近的实体
AutoArmor=自动穿上背包里最好的盔甲
AutoBowRelease=拉弓自动释放
AutoBreed=自动繁殖动物
AutoClicker=自动快速点击鼠标
AutoCraft=自动合成指定物品
AutoCrystal=利用末影水晶击杀敌人
AutoDrop=向敌人头顶放置重力方块
AutoEat=自动进食
AutoExp=自动用经验修补你的装备
AutoFarm=自动帮你种植/收获作物
AutoFish=自动钓鱼
AutoLog=检测到敌人对你的威胁时自动退出服务器，避免战斗
AutoMace=自动重锤\n<red>需要打开杀戮光环
