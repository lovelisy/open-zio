[descriptions.settings]
AutoCrystal.DamageRatio="你与敌人之间允许的最小伤害比例。"
AutoCrystal.Sequential="严格 —— 会在爆炸数据包后立刻放置，并跳过下一个。\n强 —— 每次爆炸数据包后连续放置。"
AutoCrystal.LowerHitBox="如果可行，会尝试放在敌人脚下。"
AutoCrystal.MineIgnore="计算时会忽略你正在挖掘的方块（即将被破坏时）。"
AutoCrystal.Always="在挖掘忽略期间忽略最小伤害。"
AutoCrystal.Threshold="方块被视为已破坏前的刻数。"
AutoCrystal.Factor="每 1 个水晶发送的破坏数据包数量（ID 预测）。"
AutoCrystal.Await="动态延迟（延迟同步）。"
AutoCrystal.Extrapolation="移动预测（单位：刻）。"
AutoCrystal.Multipoint="把方块划分为多个区域，点击最近的一个。"
Aura.ExtraRange="利用 Minecraft 的姿势系统打得更远。\n<yellow>仅适用于 GrimAC。"
Aura.Magnet="改变敌人的速度，将其推向你。"
Blocker.BlockDamage="方块被视为不安全所需的伤害值。"
AntiCheat.2b2t="使用 Zio 在 2b2t.org 上运行所需的漏洞与限制。"
AntiCheat.Limiter="限制发送的数据包数量以避免被踢。"
AntiCheat.NoServerSlot="阻止服务器强制把物品放进你选中的槽位。"
AntiCheat.StrictDirection="让放置模块只点击方块可见的一面。"
AntiCheat.Placements="针对不同服务端核心的放置限制。"
ElytraFly.Responsive="跳跃/潜行时操纵俯仰角，让升降更容易。"
ElytraFly.ResponsiveDescend="潜行时暂停鞘翅飞行。"
ElytraFly.NCPBoost="利用 NCP 鞘翅检测让你飞得更快。"
ElytraFly.Factorize="仅在原版可行时才加速。"
ElytraFly.Auto="通过操纵俯仰角让你弹得更快。"
Velocity.Reduce="减少发送的数据包数量。"
Velocity.Static="让 Reduce 在静止时也生效。"
Fireworks.FastLaunch="使用烟花时立刻起飞。"
SpeedMine.Async="快速发送破坏数据包以尽可能快地重复挖掘。"
EntityControl.GrimOverflow="滥用 ViaVersion 与 Grim 的实体数据包。\n<red>需要把 Via 协议版本设为 1.20.6 或更低。"
