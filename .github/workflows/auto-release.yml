name: Auto Build and Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auto-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      name: ${{ steps.meta.outputs.name }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle cache and validate wrapper
        uses: gradle/actions/setup-gradle@v6

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Read project version and resolve release metadata
        id: meta
        run: |
          set -euo pipefail
          VERSION=$(grep -E '^version=' gradle.properties | head -n1 | sed -E 's/.*=//; s/[[:space:]]//g')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=latest" >> "$GITHUB_OUTPUT"
          echo "name=Open Zio Latest" >> "$GITHUB_OUTPUT"
          echo "Building Open Zio $VERSION into the rolling latest release"

      - name: Build release JAR
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew clean build --no-daemon --stacktrace

      - name: Prepare remapped JAR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          mapfile -t jars < <(find build/libs -maxdepth 1 -type f \
            -name 'OpenMio-*.jar' \
            ! -name '*-dev.jar' \
            ! -name '*-sources.jar' | sort)
          if [ "${#jars[@]}" -ne 1 ]; then
            echo "Expected exactly one production JAR; found ${#jars[@]}:"
            find build/libs -maxdepth 1 -type f -print | sort
            exit 1
          fi
          cp "${jars[0]}" "release/OpenMio-${{ steps.meta.outputs.version }}.jar"
          ls -lh release/

      - name: Upload the mod jar
        uses: actions/upload-artifact@v4
        with:
          name: open-zio-jar
          path: release/OpenMio-${{ steps.meta.outputs.version }}.jar
          if-no-files-found: error
          retention-days: 7

  release:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout the release commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Point the rolling tag at this build
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "${{ needs.build.outputs.tag }}" "${{ github.sha }}"
          git push --force origin "refs/tags/${{ needs.build.outputs.tag }}"

      - name: Download the built jar
        uses: actions/download-artifact@v4
        with:
          name: open-zio-jar
          path: dist

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          name: ${{ needs.build.outputs.name }}
          files: dist/OpenMio-${{ needs.build.outputs.version }}.jar
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: false
          body: |
            Rolling build of the latest `main`. Always download `OpenMio-2.4.4.jar` from this release for the newest jar.
            Title stays `Open Zio Latest` and the `latest` tag is moved on every push, so the download URL never changes.
