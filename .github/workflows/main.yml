name: Manual Build & Release JAR

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'GitHub Release tag (e.g. v2.4.4)'
        required: true
        type: string
        default: 'v2.4.4'
      prerelease:
        description: 'Mark this release as a pre-release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: manual-release-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build Fabric mod and publish JAR
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle cache and validate wrapper
        uses: gradle/actions/setup-gradle@v6

      - name: Build release JAR
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew clean build --no-daemon --stacktrace

      - name: Prepare remapped JAR and SHA-256
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          mapfile -t jars < <(find build/libs -maxdepth 1 -type f \
            -name 'OpenMio-*.jar' \
            ! -name '*-dev.jar' \
            ! -name '*-sources.jar' | sort)
          if [ "${#jars[@]}" -ne 1 ]; then
            echo "Expected exactly one production JAR; found ${#jars[@]}:"
            find build/libs -maxdepth 1 -type f -print | sort
            exit 1
          fi
          cp "${jars[0]}" release/
          (cd release && sha256sum ./*.jar > SHA256SUMS.txt)
          ls -lh release/

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: open-zio-jar
          path: release/
          if-no-files-found: error

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.release_tag }}
          target_commitish: ${{ github.sha }}
          name: Open Zio ${{ inputs.release_tag }}
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: true
          overwrite_files: true
          fail_on_unmatched_files: true
          files: |
            release/*.jar
            release/SHA256SUMS.txt
